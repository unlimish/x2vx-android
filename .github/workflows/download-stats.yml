name: Download stats

# Counts downloads from GitHub Releases and IzzyOnDroid once a day, and keeps
# the results on the `stats` branch:
#   downloads.json / github.json / izzyondroid.json  shields.io endpoint badges
#   summary.json   latest numbers per source
#   history.csv    one row per day, for tracking over time
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}
  push:
    branches: [claude/bold-cannon-chq6hz]
    paths: [.github/workflows/download-stats.yml, .github/scripts/download_stats.py]

concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check out the stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats > /dev/null; then
            git fetch --depth=1 origin stats
            git worktree add stats-data FETCH_HEAD
          else
            mkdir stats-data
          fi

      - name: Collect download counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/download_stats.py stats-data

      - name: Show results
        run: cat stats-data/summary.json stats-data/downloads.json && tail -n 5 stats-data/history.csv

      # Only the default branch publishes; runs on other branches are dry runs.
      - name: Publish to the stats branch
        if: github.ref_name == github.event.repository.default_branch
        working-directory: stats-data
        run: |
          [ -d .git ] || [ -f .git ] || { git init -q -b stats && git remote add origin "$(git -C .. remote get-url origin)"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Update download stats"
            git push origin HEAD:refs/heads/stats
          fi
