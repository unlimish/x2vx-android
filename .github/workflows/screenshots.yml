name: Screenshots

# Takes store screenshots on an emulator and commits them to the branch.
# Run it manually from the Actions tab (on a branch, not master) when the UI changes.
on:
  workflow_dispatch: {}
  push:
    branches-ignore: [master]
    paths:
      - .github/workflows/screenshots.yml
      - .github/scripts/screenshots.sh

jobs:
  screenshots:
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/screenshots.sh

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: fastlane/metadata/android/*/images/phoneScreenshots/*.png

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastlane/metadata/android/*/images/phoneScreenshots
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update store screenshots"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
