name: Download stats probe (temporary)
on:
  push:
    branches: [claude/bold-cannon-chq6hz]
    paths: [.github/workflows/download-stats-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://dlstats.izzyondroid.org/iodstats/apk_downloads
          curl -fsSL "$B/" | sed -n '1,40p'
          for y in 2024 2025 2026; do echo "== $y"; curl -fsSL "$B/$y/" | grep -o 'href="[^"]*"' | head -80 | tr '\n' ' '; echo; done
          F=$(curl -fsSL "$B/2026/" | grep -o 'href="[^"]*\.json"' | sed 's/href="//;s/"//' | tail -n 2 | head -n 1)
          echo "file: $F"
          curl -fsSL "$B/2026/$F" -o week.json; ls -l week.json; head -c 600 week.json; echo
          python3 - <<'PY'
          import json
          d = json.load(open("week.json"))
          print(type(d))
          ks = sorted(d) if isinstance(d, dict) else []
          print("top keys", ks[:10])
          if ks:
              v = d[ks[0]]
              print("type of value", type(v), (list(v)[:5] if isinstance(v, dict) else v))
              for k in ks:
                  x = d[k]
                  if isinstance(x, dict) and "sh.unlimi.x2vx" in x:
                      print("x2vx", k, x["sh.unlimi.x2vx"])
          PY
          curl -fsSL "$B/2026/" | grep -v 'href="\.\./"' | tail -5
